plugins {
	// 26.1+ ship unobfuscated; older versions need Loom's remapping flavor.
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

// Polarium for every Fabric version of Minecraft it supports. Pick the version
// with -Pminecraft_version=1.21.11; code that differs between versions sits
// in //#if MC >= 26.1 … //#else … //#endif blocks (see preprocess below).
def mc = project.minecraft_version

/** Minecraft version as numbers, for comparing (26.1.2 → [26, 1, 2]). */
def parseVersion = { String v -> v.tokenize('.').collect { it as int } }

def compareVersions = { String a, String b ->
	def x = parseVersion(a)
	def y = parseVersion(b)
	for (int i = 0; i < Math.max(x.size(), y.size()); i++) {
		int d = (i < x.size() ? x[i] : 0) <=> (i < y.size() ? y[i] : 0)
		if (d != 0) {
			return d
		}
	}
	return 0
}

def atLeast = { String v -> compareVersions(mc, v) >= 0 }

apply plugin: atLeast('26.1') ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

/** "MC >= 26.1 && MC < 26.3": comparisons joined by && or ||. */
def evalCondition
evalCondition = { String expr ->
	if (expr.contains('||')) {
		return expr.split(/\|\|/).any { evalCondition(it.trim()) }
	}
	return expr.split('&&').every { part ->
		def m = part.trim() =~ /^MC\s*(>=|<=|==|!=|>|<)\s*([0-9.]+)$/
		if (!m.matches()) {
			throw new GradleException("bad //#if condition: ${part.trim()}")
		}
		int c = compareVersions(mc, m.group(2))
		switch (m.group(1)) {
			case '>=': return c >= 0
			case '<=': return c <= 0
			case '>': return c > 0
			case '<': return c < 0
			case '==': return c == 0
			default: return c != 0
		}
	}
}

/** Keep the lines of active //#if branches; drop the rest. */
def preprocessSource = { String text, String name ->
	def out = new StringBuilder()
	def stack = [] // each: [active, anyBranchTaken]
	text.eachLine { line ->
		def t = line.trim()
		boolean outerActive = stack.every { it[0] }
		if (t.startsWith('//#if ')) {
			boolean on = outerActive && evalCondition(t.substring(6))
			stack << [on, on]
		} else if (t.startsWith('//#elif ')) {
			def top = stack.last()
			boolean parent = stack.size() == 1 || stack[0..-2].every { it[0] }
			boolean on = parent && !top[1] && evalCondition(t.substring(8))
			top[0] = on
			top[1] = top[1] || on
		} else if (t == '//#else') {
			def top = stack.last()
			boolean parent = stack.size() == 1 || stack[0..-2].every { it[0] }
			top[0] = parent && !top[1]
			top[1] = true
		} else if (t == '//#endif') {
			if (stack.isEmpty()) {
				throw new GradleException("stray //#endif in ${name}")
			}
			stack.removeLast()
		} else if (outerActive) {
			out.append(line).append('\n')
			return
		}
		// Keep line numbers stable for compiler errors.
		out.append('\n')
	}
	if (!stack.isEmpty()) {
		throw new GradleException("unclosed //#if in ${name}")
	}
	return out.toString()
}

/**
 * Classes that moved between versions, old name → new: written once here instead of a //#if
 * around every import. 26.3 moved the GPU layer from com.mojang.blaze3d to com.mojang.renderpearl
 * (one API over its OpenGL and Vulkan backends).
 */
def renames = atLeast('26.3') ? [
		'com.mojang.blaze3d.buffers.GpuBufferSlice'      : 'com.mojang.renderpearl.api.buffers.GpuBufferSlice',
		'com.mojang.blaze3d.buffers.GpuBuffer'           : 'com.mojang.renderpearl.api.buffers.GpuBuffer',
		'com.mojang.blaze3d.buffers.GpuFence'            : 'com.mojang.renderpearl.api.commands.GpuFence',
		'com.mojang.blaze3d.opengl.GlTexture'            : 'com.mojang.renderpearl.backend.opengl.GlTexture',
		'com.mojang.blaze3d.pipeline.BindGroupLayout'    : 'com.mojang.renderpearl.api.pipeline.BindGroupLayout',
		'com.mojang.blaze3d.pipeline.ColorTargetState'   : 'com.mojang.renderpearl.api.pipeline.ColorTargetState',
		'com.mojang.blaze3d.pipeline.DepthStencilState'  : 'com.mojang.renderpearl.api.pipeline.DepthStencilState',
		'com.mojang.blaze3d.pipeline.RenderPipeline'     : 'com.mojang.renderpearl.api.pipeline.RenderPipeline',
		'com.mojang.blaze3d.platform.PolygonMode'        : 'com.mojang.renderpearl.api.pipeline.PolygonMode',
		'com.mojang.blaze3d.shaders.ShaderType'          : 'com.mojang.renderpearl.api.pipeline.ShaderType',
		'com.mojang.blaze3d.shaders.UniformType'         : 'com.mojang.renderpearl.api.pipeline.UniformType',
		'com.mojang.blaze3d.systems.CommandEncoder'      : 'com.mojang.renderpearl.api.commands.CommandEncoder',
		'com.mojang.blaze3d.systems.GpuDevice'           : 'com.mojang.renderpearl.api.device.GpuDevice',
		'com.mojang.blaze3d.systems.GpuSurface'          : 'com.mojang.renderpearl.api.device.GpuSurface',
		'com.mojang.blaze3d.systems.RenderPass'          : 'com.mojang.renderpearl.api.commands.RenderPass',
		'com.mojang.blaze3d.textures.GpuSampler'         : 'com.mojang.renderpearl.api.textures.GpuSampler',
		'com.mojang.blaze3d.textures.GpuTextureView'     : 'com.mojang.renderpearl.api.textures.GpuTextureView',
		'com.mojang.blaze3d.textures.GpuTexture'         : 'com.mojang.renderpearl.api.textures.GpuTexture',
		'com.mojang.blaze3d.vertex.VertexFormat'         : 'com.mojang.renderpearl.api.vertex.VertexFormat',
		'com.mojang.blaze3d.GpuFormat'                   : 'com.mojang.renderpearl.api.GpuFormat',
		'com.mojang.blaze3d.IndexType'                   : 'com.mojang.renderpearl.api.pipeline.IndexType',
		'com.mojang.blaze3d.PrimitiveTopology'           : 'com.mojang.renderpearl.api.pipeline.PrimitiveTopology',
		// Type-annotated names (`pkg.@Nullable Type`) name the package alone.
		'com.mojang.blaze3d.textures.@'                  : 'com.mojang.renderpearl.api.textures.@',
] : [:]

/** Whole names only: GpuBuffer must not catch GpuBufferSlice. Mixin targets name them as paths (a/b/C) too. */
def applyRenames = { String text ->
	def both = renames + renames.findAll { k, v -> !k.endsWith('@') }.collectEntries { k, v -> [(k.replace('.', '/')): v.replace('.', '/')] }
	both.inject(text) { String acc, String from, String to ->
		acc.replaceAll(java.util.regex.Pattern.quote(from) + (from.endsWith('@') ? '' : '(?![A-Za-z0-9_])'), java.util.regex.Matcher.quoteReplacement(to))
	}
}

def preprocessedJava = layout.buildDirectory.dir("preprocessed/${mc}/java")

tasks.register('preprocessJava') {
	inputs.dir 'src/main/java'
	inputs.property 'minecraft_version', mc
	outputs.dir preprocessedJava
	// Cheap, and the rules above live in this script: always regenerate.
	outputs.upToDateWhen { false }
	doLast {
		def outDir = preprocessedJava.get().asFile
		project.delete(outDir)
		def root = file('src/main/java')
		root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
			def rel = root.toPath().relativize(f.toPath()).toString()
			def target = new File(outDir, rel)
			target.parentFile.mkdirs()
			target.text = applyRenames(preprocessSource(f.getText('UTF-8'), rel))
		}
	}
}

base {
	archivesName = "polarium-${mc}"
}

sourceSets {
	main {
		java.srcDirs = [preprocessedJava]
	}
}

tasks.named('compileJava') {
	dependsOn 'preprocessJava'
}

dependencies {
	minecraft "com.mojang:minecraft:${mc}"
	// 26.1 and later ship unobfuscated; older versions use Mojang's names.
	if (!atLeast('26.1')) {
		mappings loom.officialMojangMappings()
	}
	if (atLeast('26.1')) {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	} else {
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	}
}

/** The Java the game runs on for this version. */
def javaVersion = atLeast('26.1') ? 25 : atLeast('1.20.5') ? 21 : atLeast('1.18') ? 17 : atLeast('1.17') ? 16 : 8

// The Minecraft versions this jar loads on (-Pcovers=26.1,26.1.1,26.1.2,
// from targets.json); just the built version by default.
def covers = (project.findProperty('covers') ?: mc).tokenize(',')
def minecraftRange = '[' + covers.collect { '"' + it.trim() + '"' }.join(', ') + ']'

// The oldest Fabric Loader that can actually load this jar: Polarium needs
// nothing newer than the loader's bundled Mixin and MixinExtras (0.16.9 has
// both), so players aren't forced onto a needlessly new loader (tested on
// 26.1.2 with 0.19.3).
def loaderMin = '0.16.9'

processResources {
	def props = [
			version: project.version,
			minecraft_range: minecraftRange,
			java: javaVersion,
			loader_min: loaderMin,
	]
	inputs.properties props
	filesMatching(['fabric.mod.json', 'polarium.mixins.json']) {
		expand props
	}
	// Mixins whose source is compiled out for this version (//#if) aren't listed: the list follows the
	// preprocessed sources, so it's made again whenever they change.
	dependsOn 'preprocessJava'
	inputs.dir(preprocessedJava)
	doLast {
		def config = new File(destinationDir, 'polarium.mixins.json')
		def json = new groovy.json.JsonSlurper().parse(config)
		def mixinDir = new File(preprocessedJava.get().asFile, 'com/arcticlauncher/polarium/mixin')
		json.client = json.client.findAll { name ->
			def source = new File(mixinDir, "${name}.java")
			source.exists() && java.util.regex.Pattern.compile('(class|interface)[ ]+' + name + '[ <{]').matcher(source.getText('UTF-8')).find()
		}
		logger.lifecycle("Polarium mixins for ${mc}: ${json.client.size()}")
		config.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), 'UTF-8')
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
	it.options.encoding = 'UTF-8'
	it.options.compilerArgs += ['-Xmaxerrs', '1000']
}

java {
	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}
