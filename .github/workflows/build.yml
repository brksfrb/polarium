name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.3', '26.2', '26.1.2', '1.21.11']
        include:
          # Each version builds on the Java its game runs on.
          - java: '25'
          - minecraft: '1.21.11'
            java: '21'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build for Minecraft ${{ matrix.minecraft }}
        run: ./gradlew build -Pminecraft_version=${{ matrix.minecraft }}
      - uses: actions/upload-artifact@v4
        with:
          name: polarium-${{ matrix.minecraft }}
          path: build/libs/*.jar

  legacy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.8.9']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build for Legacy Fabric ${{ matrix.minecraft }}
        run: ./gradlew -p legacy build -Pminecraft_version=${{ matrix.minecraft }}
      - uses: actions/upload-artifact@v4
        with:
          name: polarium-${{ matrix.minecraft }}
          path: legacy/build/libs/*.jar
